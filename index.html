
<h2 class="sr-only">Gestor completo Casa La Manga — gastos, ingresos, resumen anual y exportación de datos</h2>
<style>
*{box-sizing:border-box;margin:0;padding:0}
.app{max-width:420px;margin:0 auto;padding:0 0 32px;font-family:var(--font-sans)}
.header{padding:16px 16px 0;display:flex;align-items:center;justify-content:space-between}
.header h1{font-size:18px;font-weight:500;color:var(--color-text-primary)}
.header p{font-size:12px;color:var(--color-text-secondary);margin-top:1px}
.nav-tabs{display:flex;border-bottom:0.5px solid var(--color-border-tertiary);margin:12px 0 0}
.nav-tab{flex:1;padding:10px 4px;font-size:13px;font-weight:500;text-align:center;cursor:pointer;color:var(--color-text-secondary);border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none}
.nav-tab.active{color:var(--color-text-primary);border-bottom-color:var(--color-text-primary)}
.view{display:none;padding:0}
.view.active{display:block}
.month-nav{display:flex;align-items:center;gap:8px;padding:12px 16px 8px}
.month-nav button{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:6px 10px;cursor:pointer;color:var(--color-text-primary);font-size:15px;min-width:36px;min-height:36px}
.month-label{flex:1;text-align:center;font-size:16px;font-weight:500;color:var(--color-text-primary)}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:0 16px 12px}
.stat{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:12px}
.stat .lbl{font-size:11px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.stat .val{font-size:19px;font-weight:500;color:var(--color-text-primary)}
.stat.neg .val{color:var(--color-text-danger)}
.stat.pos .val{color:var(--color-text-success)}
.sec{padding:0 16px 8px}
.sec-hdr{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-title{font-size:12px;font-weight:500;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px}
.btn-add{background:none;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);padding:5px 10px;font-size:13px;cursor:pointer;color:var(--color-text-primary);display:flex;align-items:center;gap:4px}
.row{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:6px;display:flex;align-items:center;gap:8px}
.row-info{flex:1;min-width:0}
.row-name{font-size:14px;font-weight:500;color:var(--color-text-primary);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row-sub{font-size:11px;color:var(--color-text-secondary);margin-top:2px;display:flex;align-items:center;gap:4px}
.row-amt{font-size:15px;font-weight:500;color:var(--color-text-primary);white-space:nowrap}
.row-amt.ing{color:var(--color-text-success)}
.badge{display:inline-block;font-size:10px;padding:2px 5px;border-radius:4px;font-weight:500}
.badge.fijo{background:var(--color-background-info);color:var(--color-text-info)}
.badge.manual{background:var(--color-background-warning);color:var(--color-text-warning)}
.badge.rec{background:var(--color-background-success);color:var(--color-text-success)}
.ic-btn{background:none;border:none;cursor:pointer;color:var(--color-text-secondary);font-size:17px;padding:3px;line-height:1;flex-shrink:0}
.ic-btn:hover{color:var(--color-text-danger)}
.divider{height:0.5px;background:var(--color-border-tertiary);margin:6px 16px 12px}
.suggest{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;margin:0 16px 10px}
.sug-lbl{font-size:12px;color:var(--color-text-secondary);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--color-background-primary);border:0.5px solid var(--color-border-secondary);border-radius:20px;padding:5px 10px;font-size:12px;cursor:pointer;color:var(--color-text-primary);display:flex;align-items:center;gap:3px}
.pago-row{display:flex;gap:8px;margin:0 16px 12px}
.pago-btn{flex:1;padding:10px 8px;border-radius:var(--border-radius-md);border:0.5px solid var(--color-border-secondary);background:none;cursor:pointer;font-size:12px;color:var(--color-text-secondary);text-align:center}
.pago-btn .pb-name{font-weight:500;font-size:13px;color:var(--color-text-primary);margin-bottom:3px}
.pago-btn.pagado{background:var(--color-background-success);border-color:var(--color-border-success)}
.pago-btn.pagado .pb-name{color:var(--color-text-success)}
.pago-btn.pagado .pb-status{color:var(--color-text-success)}
.empty{text-align:center;padding:16px;color:var(--color-text-secondary);font-size:13px}
.copy-banner{background:var(--color-background-warning);border-radius:var(--border-radius-md);padding:10px 12px;margin:0 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.copy-banner p{font-size:12px;color:var(--color-text-warning);flex:1}
.copy-banner button{background:none;border:0.5px solid var(--color-border-warning);border-radius:var(--border-radius-md);padding:5px 10px;font-size:12px;cursor:pointer;color:var(--color-text-warning);white-space:nowrap}
.anual-grid{padding:12px 16px}
.anual-mes{background:var(--color-background-primary);border:0.5px solid var(--color-border-tertiary);border-radius:var(--border-radius-md);padding:10px 12px;margin-bottom:8px}
.anual-mes-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.anual-mes-name{font-size:14px;font-weight:500;color:var(--color-text-primary)}
.anual-mes-bal{font-size:14px;font-weight:500}
.anual-mes-bal.pos{color:var(--color-text-success)}
.anual-mes-bal.neg{color:var(--color-text-danger)}
.anual-mes-detail{display:flex;gap:16px}
.anual-det{font-size:12px;color:var(--color-text-secondary)}
.anual-det span{color:var(--color-text-primary);font-weight:500}
.anual-cerrado{font-size:10px;background:var(--color-background-success);color:var(--color-text-success);padding:2px 6px;border-radius:4px;font-weight:500}
.anual-total{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:14px 16px;margin:0 16px 12px}
.anual-total-title{font-size:12px;color:var(--color-text-secondary);text-transform:uppercase;letter-spacing:.5px;margin-bottom:8px}
.anual-total-row{display:flex;justify-content:space-between;font-size:14px;color:var(--color-text-secondary);margin-bottom:4px}
.anual-total-row.main{font-size:16px;font-weight:500;color:var(--color-text-primary);margin-top:6px;border-top:0.5px solid var(--color-border-tertiary);padding-top:6px}
.anual-total-row.main.pos{color:var(--color-text-success)}
.anual-total-row.main.neg{color:var(--color-text-danger)}
.export-area{padding:0 16px 16px}
.export-btn{width:100%;padding:13px;background:var(--color-text-primary);color:var(--color-background-primary);border:none;border-radius:var(--border-radius-md);font-size:15px;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:8px}
.export-json{background:var(--color-background-secondary);border-radius:var(--border-radius-md);padding:10px 12px;font-size:11px;color:var(--color-text-secondary);word-break:break-all;max-height:140px;overflow-y:auto;font-family:var(--font-mono);display:none;margin-top:8px}
.modal-wrap{display:none;min-height:500px;background:rgba(0,0,0,.45);align-items:flex-end;justify-content:center}
.modal-wrap.open{display:flex}
.modal{background:var(--color-background-primary);border-radius:16px 16px 0 0;padding:20px 16px 36px;width:100%}
.modal h3{font-size:16px;font-weight:500;margin-bottom:16px;color:var(--color-text-primary)}
.field{margin-bottom:11px}
.field label{display:block;font-size:12px;color:var(--color-text-secondary);margin-bottom:4px}
.field input,.field select{width:100%;padding:9px 12px;border:0.5px solid var(--color-border-secondary);border-radius:var(--border-radius-md);font-size:15px;background:var(--color-background-secondary);color:var(--color-text-primary)}
.modal-acts{display:flex;gap:8px;margin-top:14px}
.modal-acts button{flex:1;padding:12px;border-radius:var(--border-radius-md);font-size:15px;font-weight:500;cursor:pointer}
.btn-cancel{background:none;border:0.5px solid var(--color-border-secondary);color:var(--color-text-secondary)}
.btn-save{background:var(--color-text-primary);border:none;color:var(--color-background-primary)}
</style>

<div class="app">
  <div class="header">
    <div>
      <h1><i class="ti ti-home" aria-hidden="true" style="font-size:16px;margin-right:6px;vertical-align:-2px"></i>Casa La Manga</h1>
      <p>Meca Guerrero &amp; Bernal Meca</p>
    </div>
    <button class="btn-add" onclick="exportJSON()" style="font-size:12px"><i class="ti ti-download" aria-hidden="true"></i>Guardar</button>
  </div>

  <div class="nav-tabs">
    <button class="nav-tab active" onclick="setView('mes')"><i class="ti ti-calendar" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Mes</button>
    <button class="nav-tab" onclick="setView('anual')"><i class="ti ti-chart-bar" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Anual</button>
    <button class="nav-tab" onclick="setView('config')"><i class="ti ti-settings" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Fijos</button>
  </div>

  <div class="view active" id="view-mes">
    <div class="month-nav">
      <button onclick="prevMonth()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
      <div class="month-label" id="month-label">Mayo 2026</div>
      <button onclick="nextMonth()"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
    </div>
    <div id="copy-banner"></div>
    <div class="stats" id="stats-area"></div>
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title"><i class="ti ti-receipt" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Gastos</span>
        <button class="btn-add" onclick="openModal('gasto')"><i class="ti ti-plus" aria-hidden="true"></i> Añadir</button>
      </div>
      <div id="gastos-list"></div>
    </div>
    <div id="suggest-area"></div>
    <div class="divider"></div>
    <div class="sec">
      <div class="sec-hdr">
        <span class="sec-title"><i class="ti ti-coins" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Ingresos</span>
        <button class="btn-add" onclick="openModal('ingreso')"><i class="ti ti-plus" aria-hidden="true"></i> Añadir</button>
      </div>
      <div id="ingresos-list"></div>
    </div>
    <div class="divider"></div>
    <div class="sec"><div class="sec-hdr"><span class="sec-title"><i class="ti ti-users" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Estado de pago</span></div></div>
    <div class="pago-row">
      <button class="pago-btn" id="pago-yo" onclick="togglePago('yo')">
        <div class="pb-name">Meca Guerrero</div>
        <div class="pb-status" id="pago-yo-lbl">Pendiente</div>
      </button>
      <button class="pago-btn" id="pago-her" onclick="togglePago('her')">
        <div class="pb-name">Bernal Meca</div>
        <div class="pb-status" id="pago-her-lbl">Pendiente</div>
      </button>
    </div>
  </div>

  <div class="view" id="view-anual">
    <div style="padding:12px 16px 8px;display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:16px;font-weight:500;color:var(--color-text-primary)">Resumen <span id="anual-year">2026</span></span>
      <div style="display:flex;gap:6px">
        <button class="btn-add" onclick="anualYear--; renderAnual()"><i class="ti ti-chevron-left" aria-hidden="true"></i></button>
        <button class="btn-add" onclick="anualYear++; renderAnual()"><i class="ti ti-chevron-right" aria-hidden="true"></i></button>
      </div>
    </div>
    <div id="anual-totales"></div>
    <div class="anual-grid" id="anual-grid"></div>
  </div>

  <div class="view" id="view-config">
    <div style="padding:14px 16px 8px">
      <div class="sec-hdr">
        <span class="sec-title"><i class="ti ti-bolt" aria-hidden="true" style="vertical-align:-2px;margin-right:3px"></i>Gastos fijos recurrentes</span>
        <button class="btn-add" onclick="openModal('fijo')"><i class="ti ti-plus" aria-hidden="true"></i> Añadir</button>
      </div>
      <p style="font-size:12px;color:var(--color-text-secondary);margin-bottom:12px">Se precargan cada mes nuevo automáticamente</p>
      <div id="fijos-list"></div>
    </div>
  </div>
</div>

<div class="modal-wrap" id="modal-bg">
  <div class="modal">
    <h3 id="modal-title">Nuevo gasto</h3>
    <div class="field"><label>Nombre</label><input type="text" id="f-nombre" placeholder="Ej: Comunidad"/></div>
    <div class="field"><label>Importe (€)</label><input type="number" id="f-importe" placeholder="0.00" step="0.01" min="0" inputmode="decimal"/></div>
    <div class="field" id="f-tipo-wrap"><label>Tipo</label>
      <select id="f-tipo">
        <option value="manual">Manual (solo este mes)</option>
        <option value="fijo">Fijo (recurrente)</option>
      </select>
    </div>
    <div class="modal-acts">
      <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
      <button class="btn-save" onclick="saveItem()">Guardar</button>
    </div>
  </div>
</div>

<div style="padding:0 16px;display:none" id="json-export-area">
  <button class="export-btn" onclick="copyJSON()"><i class="ti ti-copy" aria-hidden="true"></i>Copiar JSON actualizado</button>
  <div class="export-json" id="json-out"></div>
</div>

<script>
const MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_ES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const FRECUENTES=[
  {nombre:'Comunidad',tipo:'fijo'},{nombre:'Seguro hogar',tipo:'fijo'},
  {nombre:'IBI',tipo:'manual'},{nombre:'Agua',tipo:'fijo'},
  {nombre:'Reparación',tipo:'manual'},{nombre:'Limpieza',tipo:'manual'},
  {nombre:'Basura',tipo:'fijo'}
];

const RAW={"currentYear":2026,"nombres":{"yo":"Familia Meca Guerrero","her":"Familia Bernal Meca"},"fijosCfg":[{"id":1,"nombre":"INTERNET","importe":25,"payer":"ambos"},{"id":2,"nombre":"LUZ","importe":50,"payer":"ambos"}],"vdata":{"1":{"2026":{"abr":{"cerrado":false,"gastos":[{"id":1,"nombre":"INTERNET","importe":1.16,"tipo":"fijo","payer":"ambos"},{"id":2,"nombre":"LUZ","importe":41.67,"tipo":"fijo","payer":"ambos"},{"id":3,"nombre":"SOFA","importe":36.43,"tipo":"manual","payer":"ambos"}],"ingresos":[{"id":2,"nombre":"Alquiler 2","importe":144.5},{"id":3,"nombre":"Alquiler 1","importe":137.28}],"prev":[],"pagado":{}},"mar":{"cerrado":false,"gastos":[{"id":1,"nombre":"INTERNET","importe":0,"tipo":"fijo","payer":"ambos"},{"id":2,"nombre":"LUZ","importe":47.76,"tipo":"fijo","payer":"ambos"},{"id":3,"nombre":"SOFA","importe":36.43,"tipo":"manual","payer":"ambos"}],"ingresos":[],"prev":[],"pagado":{"yo":true}},"feb":{"cerrado":false,"gastos":[{"id":1,"nombre":"INTERNET","importe":0,"tipo":"fijo","payer":"ambos"},{"id":2,"nombre":"LUZ","importe":51.78,"tipo":"fijo","payer":"ambos"},{"id":3,"nombre":"SOFA","importe":36.43,"tipo":"manual","payer":"ambos"}],"ingresos":[],"prev":[],"pagado":{"yo":true}},"ene":{"cerrado":true,"gastos":[{"id":1,"nombre":"INTERNET","importe":25,"tipo":"fijo","payer":"ambos"},{"id":2,"nombre":"LUZ","importe":50,"tipo":"fijo","payer":"ambos"}],"ingresos":[{"id":1,"nombre":"Fondo cuenta","importe":60.04}],"prev":[],"pagado":{"yo":true,"her":true}},"may":{"cerrado":false,"gastos":[{"id":1,"nombre":"INTERNET","importe":25,"tipo":"fijo","payer":"ambos"},{"id":2,"nombre":"LUZ","importe":52.4,"tipo":"fijo","payer":"ambos"},{"id":3,"nombre":"Sofá","importe":36,"tipo":"manual","payer":"ambos"}],"ingresos":[],"prev":[]}}}}};

let S={
  year:2026, monthIdx:4,
  modalType:'gasto', editId:null, modalFijo:false,
  vdata:JSON.parse(JSON.stringify(RAW.vdata['1'])),
  fijosCfg:JSON.parse(JSON.stringify(RAW.fijosCfg))
};
let anualYear=2026;

function getMKey(){return MESES[S.monthIdx]}
function getMD(){
  const y=String(S.year), m=getMKey();
  if(!S.vdata[y]) S.vdata[y]={};
  if(!S.vdata[y][m]){
    const prevMeses=getPrevMonthGastos(y,m);
    S.vdata[y][m]={cerrado:false,gastos:buildDefaultGastos(prevMeses),ingresos:[],prev:[],pagado:{}};
    showCopyBanner(prevMeses);
  }
  return S.vdata[y][m];
}

function buildDefaultGastos(prevGastos){
  const base=S.fijosCfg.map(f=>({id:f.id,nombre:f.nombre,importe:f.importe,tipo:'fijo',payer:'ambos'}));
  if(prevGastos.length){
    const fijoIds=base.map(b=>b.id);
    prevGastos.filter(g=>g.tipo==='manual'||!fijoIds.includes(g.id)).forEach(g=>{
      base.push({...g,id:Date.now()+Math.random()});
    });
  }
  return base;
}

function getPrevMonthGastos(y,m){
  const idx=MESES.indexOf(m);
  let py=parseInt(y), pm=idx-1;
  if(pm<0){pm=11;py--;}
  const prev=(S.vdata[String(py)]||{})[MESES[pm]];
  return prev?prev.gastos:[];
}

let copyBannerData=[];
function showCopyBanner(prevGastos){
  copyBannerData=prevGastos.filter(g=>g.tipo==='manual');
}

function prevMonth(){S.monthIdx--;if(S.monthIdx<0){S.monthIdx=11;S.year--;}render()}
function nextMonth(){S.monthIdx++;if(S.monthIdx>11){S.monthIdx=0;S.year++;}render()}

function setView(v){
  document.querySelectorAll('.view').forEach(el=>el.classList.remove('active'));
  document.querySelectorAll('.nav-tab').forEach(el=>el.classList.remove('active'));
  document.getElementById('view-'+v).classList.add('active');
  const tabs=['mes','anual','config'];
  document.querySelectorAll('.nav-tab')[tabs.indexOf(v)].classList.add('active');
  if(v==='anual') renderAnual();
  if(v==='config') renderFijos();
}

function render(){
  copyBannerData=[];
  const md=getMD();
  document.getElementById('month-label').textContent=MESES_ES[S.monthIdx]+' '+S.year;

  const tG=md.gastos.reduce((s,g)=>s+(g.importe||0),0);
  const tI=md.ingresos.reduce((s,i)=>s+(i.importe||0),0);
  const bal=tI-tG;
  document.getElementById('stats-area').innerHTML=`
    <div class="stat ${bal>=0?'pos':'neg'}"><div class="lbl">Balance</div><div class="val">${(bal>=0?'+':'')+bal.toFixed(2)} €</div></div>
    <div class="stat"><div class="lbl">Por familia</div><div class="val">${(tG/2).toFixed(2)} €</div></div>
    <div class="stat neg"><div class="lbl">Total gastos</div><div class="val">${tG.toFixed(2)} €</div></div>
    <div class="stat pos"><div class="lbl">Total ingresos</div><div class="val">${tI.toFixed(2)} €</div></div>
  `;

  const cb=document.getElementById('copy-banner');
  if(copyBannerData.length){
    cb.innerHTML=`<div class="copy-banner"><p><i class="ti ti-copy" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>Se copiaron ${copyBannerData.length} gasto(s) del mes anterior. Revisa importes.</p><button onclick="document.getElementById('copy-banner').innerHTML=''">OK</button></div>`;
  } else {cb.innerHTML='';}

  const gl=document.getElementById('gastos-list');
  gl.innerHTML=!md.gastos.length?'<div class="empty">Sin gastos este mes</div>':
    md.gastos.map(g=>`
      <div class="row">
        <div class="row-info">
          <div class="row-name">${g.nombre}</div>
          <div class="row-sub"><span class="badge ${g.tipo}">${g.tipo==='fijo'?'Fijo':'Manual'}</span></div>
        </div>
        <div class="row-amt">${(g.importe||0).toFixed(2)} €</div>
        <button class="ic-btn" onclick="editGasto(${JSON.stringify(g.id)})" aria-label="Editar"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="ic-btn" onclick="delGasto(${JSON.stringify(g.id)})" aria-label="Eliminar"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>`).join('');

  const yaEn=md.gastos.map(g=>g.nombre.toLowerCase());
  const sug=FRECUENTES.filter(g=>!yaEn.includes(g.nombre.toLowerCase()));
  const sa=document.getElementById('suggest-area');
  sa.innerHTML=sug.length?`<div class="suggest"><div class="sug-lbl"><i class="ti ti-sparkles" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"></i>¿Añadir gasto frecuente?</div><div class="chips">${sug.map(g=>`<button class="chip" onclick="quickAdd('${g.nombre}','${g.tipo}')"><i class="ti ti-plus" aria-hidden="true"></i>${g.nombre}</button>`).join('')}</div></div>`:'';

  const il=document.getElementById('ingresos-list');
  il.innerHTML=!md.ingresos.length?'<div class="empty">Sin ingresos este mes</div>':
    md.ingresos.map(i=>`
      <div class="row">
        <div class="row-info"><div class="row-name">${i.nombre}</div></div>
        <div class="row-amt ing">+${(i.importe||0).toFixed(2)} €</div>
        <button class="ic-btn" onclick="editIngreso(${JSON.stringify(i.id)})" aria-label="Editar"><i class="ti ti-edit" aria-hidden="true"></i></button>
        <button class="ic-btn" onclick="delIngreso(${JSON.stringify(i.id)})" aria-label="Eliminar"><i class="ti ti-trash" aria-hidden="true"></i></button>
      </div>`).join('');

  const pag=md.pagado||{};
  document.getElementById('pago-yo').className='pago-btn'+(pag.yo?' pagado':'');
  document.getElementById('pago-her').className='pago-btn'+(pag.her?' pagado':'');
  document.getElementById('pago-yo-lbl').textContent=pag.yo?'✓ Pagado':'Pendiente';
  document.getElementById('pago-her-lbl').textContent=pag.her?'✓ Pagado':'Pendiente';
}

function renderAnual(){
  document.getElementById('anual-year').textContent=anualYear;
  const yd=S.vdata[String(anualYear)]||{};
  let totG=0,totI=0;
  const rows=MESES.map((m,i)=>{
    const md=yd[m];
    if(!md) return null;
    const tg=md.gastos.reduce((s,g)=>s+(g.importe||0),0);
    const ti=md.ingresos.reduce((s,x)=>s+(x.importe||0),0);
    totG+=tg; totI+=ti;
    const bal=ti-tg;
    return `<div class="anual-mes">
      <div class="anual-mes-hdr">
        <span class="anual-mes-name">${MESES_ES[i]}${md.cerrado?'<span class="anual-cerrado" style="margin-left:6px">Cerrado</span>':''}</span>
        <span class="anual-mes-bal ${bal>=0?'pos':'neg'}">${(bal>=0?'+':'')+bal.toFixed(2)} €</span>
      </div>
      <div class="anual-mes-detail">
        <div class="anual-det"><i class="ti ti-receipt" aria-hidden="true" style="vertical-align:-2px;margin-right:2px"></i>Gastos <span>${tg.toFixed(2)} €</span></div>
        <div class="anual-det"><i class="ti ti-coins" aria-hidden="true" style="vertical-align:-2px;margin-right:2px"></i>Ingresos <span>${ti.toFixed(2)} €</span></div>
      </div>
    </div>`;
  }).filter(Boolean);

  document.getElementById('anual-totales').innerHTML=`<div class="anual-total">
    <div class="anual-total-title">Totales ${anualYear}</div>
    <div class="anual-total-row"><span>Gastos totales</span><span>${totG.toFixed(2)} €</span></div>
    <div class="anual-total-row"><span>Ingresos totales</span><span>${totI.toFixed(2)} €</span></div>
    <div class="anual-total-row"><span>Por familia</span><span>${(totG/2).toFixed(2)} €</span></div>
    <div class="anual-total-row main ${(totI-totG)>=0?'pos':'neg'}"><span>Balance anual</span><span>${((totI-totG)>=0?'+':'')+(totI-totG).toFixed(2)} €</span></div>
  </div>`;
  document.getElementById('anual-grid').innerHTML=rows.length?rows.join(''):'<div class="empty">Sin datos para este año</div>';
}

function renderFijos(){
  const fl=document.getElementById('fijos-list');
  fl.innerHTML=S.fijosCfg.map(f=>`
    <div class="row">
      <div class="row-info"><div class="row-name">${f.nombre}</div><div class="row-sub"><span class="badge fijo">Fijo</span></div></div>
      <div class="row-amt">${(f.importe||0).toFixed(2)} €</div>
      <button class="ic-btn" onclick="editFijo(${f.id})" aria-label="Editar"><i class="ti ti-edit" aria-hidden="true"></i></button>
      <button class="ic-btn" onclick="delFijo(${f.id})" aria-label="Eliminar"><i class="ti ti-trash" aria-hidden="true"></i></button>
    </div>`).join('');
}

function togglePago(who){const md=getMD();if(!md.pagado)md.pagado={};md.pagado[who]=!md.pagado[who];render()}

function openModal(type,prefill){
  S.modalType=type; S.editId=null; S.modalFijo=type==='fijo';
  document.getElementById('modal-title').textContent=type==='gasto'?'Nuevo gasto':type==='fijo'?'Gasto fijo recurrente':'Nuevo ingreso';
  document.getElementById('f-nombre').value=prefill?prefill.nombre:'';
  document.getElementById('f-importe').value=prefill?(prefill.importe||''):'';
  document.getElementById('f-tipo-wrap').style.display=(type==='gasto')?'block':'none';
  if(prefill&&prefill.tipo) document.getElementById('f-tipo').value=prefill.tipo;
  document.getElementById('modal-bg').classList.add('open');
  setTimeout(()=>document.getElementById('f-nombre').focus(),80);
}

function closeModal(){document.getElementById('modal-bg').classList.remove('open');S.editId=null}

function saveItem(){
  const nombre=document.getElementById('f-nombre').value.trim();
  const importe=parseFloat(document.getElementById('f-importe').value)||0;
  const tipo=document.getElementById('f-tipo').value;
  if(!nombre){document.getElementById('f-nombre').focus();return}

  if(S.modalFijo){
    if(S.editId!==null){const f=S.fijosCfg.find(x=>x.id===S.editId);if(f){f.nombre=nombre;f.importe=importe}}
    else{S.fijosCfg.push({id:Date.now(),nombre:nombre.toUpperCase(),importe,payer:'ambos'})}
    closeModal(); renderFijos(); return;
  }
  const md=getMD();
  if(S.modalType==='gasto'){
    if(S.editId!==null){const g=md.gastos.find(x=>x.id===S.editId);if(g){g.nombre=nombre;g.importe=importe;g.tipo=tipo}}
    else{md.gastos.push({id:Date.now(),nombre:nombre.toUpperCase(),importe,tipo,payer:'ambos'})}
  } else {
    if(S.editId!==null){const i=md.ingresos.find(x=>x.id===S.editId);if(i){i.nombre=nombre;i.importe=importe}}
    else{md.ingresos.push({id:Date.now(),nombre,importe})}
  }
  closeModal(); render();
}

function editGasto(id){
  const md=getMD(); const g=md.gastos.find(x=>x.id===id); if(!g) return;
  S.editId=id; S.modalType='gasto'; S.modalFijo=false;
  document.getElementById('modal-title').textContent='Editar gasto';
  document.getElementById('f-nombre').value=g.nombre;
  document.getElementById('f-importe').value=g.importe;
  document.getElementById('f-tipo').value=g.tipo;
  document.getElementById('f-tipo-wrap').style.display='block';
  document.getElementById('modal-bg').classList.add('open');
}
function editIngreso(id){
  const md=getMD(); const i=md.ingresos.find(x=>x.id===id); if(!i) return;
  S.editId=id; S.modalType='ingreso'; S.modalFijo=false;
  document.getElementById('modal-title').textContent='Editar ingreso';
  document.getElementById('f-nombre').value=i.nombre;
  document.getElementById('f-importe').value=i.importe;
  document.getElementById('f-tipo-wrap').style.display='none';
  document.getElementById('modal-bg').classList.add('open');
}
function editFijo(id){
  const f=S.fijosCfg.find(x=>x.id===id); if(!f) return;
  S.editId=id; S.modalFijo=true;
  document.getElementById('modal-title').textContent='Editar fijo';
  document.getElementById('f-nombre').value=f.nombre;
  document.getElementById('f-importe').value=f.importe;
  document.getElementById('f-tipo-wrap').style.display='none';
  document.getElementById('modal-bg').classList.add('open');
}
function delGasto(id){const md=getMD();md.gastos=md.gastos.filter(g=>g.id!==id);render()}
function delIngreso(id){const md=getMD();md.ingresos=md.ingresos.filter(i=>i.id!==id);render()}
function delFijo(id){S.fijosCfg=S.fijosCfg.filter(f=>f.id!==id);renderFijos()}
function quickAdd(nombre,tipo){openModal('gasto',{nombre,tipo,importe:0})}

function getExportData(){
  return {
    ...RAW,
    fijosCfg:S.fijosCfg,
    vdata:{'1':S.vdata}
  };
}

function exportJSON(){
  const area=document.getElementById('json-export-area');
  const out=document.getElementById('json-out');
  const json=JSON.stringify(getExportData(),null,2);
  out.textContent=json;
  out.style.display='block';
  area.style.display='block';
  area.scrollIntoView({behavior:'smooth'});
  navigator.clipboard&&navigator.clipboard.writeText(json).catch(()=>{});
}
function copyJSON(){
  const json=JSON.stringify(getExportData(),null,2);
  navigator.clipboard&&navigator.clipboard.writeText(json).then(()=>{
    const btn=document.querySelector('#json-export-area button');
    btn.innerHTML='<i class="ti ti-check" aria-hidden="true"></i> Copiado';
    setTimeout(()=>{btn.innerHTML='<i class="ti ti-copy" aria-hidden="true"></i>Copiar JSON actualizado'},2000);
  }).catch(()=>{});
}

document.getElementById('modal-bg').addEventListener('click',function(e){if(e.target===this)closeModal()});

render();
</script>

<div style="padding:0 16px;margin-top:8px" id="json-export-area" style="display:none">
  <button class="export-btn" onclick="copyJSON()"><i class="ti ti-copy" aria-hidden="true"></i>Copiar JSON actualizado</button>
  <div class="export-json" id="json-out"></div>
</div>
